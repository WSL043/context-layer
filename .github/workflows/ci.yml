name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --check apps/browser-extension/service-worker.js
      - run: node --check apps/browser-extension/protocol.js
      - run: node --test apps/browser-extension/tests/*.test.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('apps/browser-extension/manifest.json'))"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: git diff --exit-code Cargo.lock

  normalize-sortable-time-key:
    if: github.event_name == 'pull_request' && github.head_ref == 'personal-context-sortable-time-key'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-context-sortable-time-key
      - run: rustup update stable
      - run: python tools/apply_sortable_time_key.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit generated sortable-time migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_sortable_time_key.py
          git add -A
          git commit -m "fix: use canonical sortable timeline time keys"
          git push origin HEAD:personal-context-sortable-time-key
