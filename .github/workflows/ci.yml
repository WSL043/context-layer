name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --check apps/browser-extension/service-worker.js
      - run: node --check apps/browser-extension/protocol.js
      - run: node --test apps/browser-extension/tests/*.test.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('apps/browser-extension/manifest.json'))"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
