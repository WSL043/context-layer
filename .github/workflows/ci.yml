name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --check apps/browser-extension/service-worker.js
      - run: node --check apps/browser-extension/protocol.js
      - run: node --test apps/browser-extension/tests/*.test.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('apps/browser-extension/manifest.json'))"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: git diff --exit-code Cargo.lock

  normalize-v2-storage:
    if: github.event_name == 'pull_request' && github.head_ref == 'personal-context-v2-envelope'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: rustup update stable
      - name: Normalize module layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('crates/storage-sqlite/src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          if '\nmod v2;\n' not in text:
              lib.write_text(text.rstrip() + '\n\nmod v2;\n', encoding='utf-8')

          manifest = Path('crates/storage-sqlite/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('\n[lib]\npath = "src/v2_lib.rs"\n', '')
          manifest.write_text(text, encoding='utf-8')

          wrapper = Path('crates/storage-sqlite/src/v2_lib.rs')
          if wrapper.exists():
              wrapper.unlink()
          PY
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit normalization when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: normalize v2 storage module and lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
