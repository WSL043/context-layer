name: retrieval-finalize-once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'personal-context-retrieval'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-context-retrieval
      - run: rustup update stable
      - run: python tools/finalize_retrieval.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit final retrieval shape and remove staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch \
            tools/finalize_retrieval.py \
            tools/apply_retrieval_migration.py \
            .github/workflows/retrieval-finalize.yml \
            .github/workflows/apply-retrieval-storage.yml
          git add -A
          git commit -m "fix: finalize policy-gated retrieval"
          git push origin HEAD:personal-context-retrieval
