name: apply-retrieval-storage-once

on:
  push:
    branches: [personal-context-retrieval]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: run retrieval migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-context-retrieval
      - run: rustup update stable
      - run: python tools/apply_retrieval_migration.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit migration and remove staging files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_retrieval_migration.py .github/workflows/apply-retrieval-storage.yml
          git add -A
          git commit -m "feat: add indexed raw timeline retrieval"
          git push origin HEAD:personal-context-retrieval
