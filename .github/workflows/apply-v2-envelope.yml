name: apply-v2-envelope

on:
  push:
    branches: [personal-context-v2-envelope]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap: run v2 envelope patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: personal-context-v2-envelope
      - run: rustup update stable
      - run: python tools/apply_v2_envelope.py
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Commit generated v2 envelope integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_v2_envelope.py .github/workflows/apply-v2-envelope.yml
          git add -A
          git commit -m "feat: wire v2 envelope through storage and local API"
          git push origin HEAD:personal-context-v2-envelope
