[workspace]
members = [
  "apps/context-agent",
  "apps/context-native-host",
  "crates/content-vault",
  "crates/contracts",
  "crates/core",
  "crates/local-ipc",
  "crates/platform-windows",
  "crates/screenpipe-adapter",
  "crates/storage-sqlite",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
context-content-vault = { path = "crates/content-vault" }
context-contracts = { path = "crates/contracts" }
context-core = { path = "crates/core" }
context-local-ipc = { path = "crates/local-ipc" }
context-platform-windows = { path = "crates/platform-windows" }
context-screenpipe-adapter = { path = "crates/screenpipe-adapter" }
context-storage-sqlite = { path = "crates/storage-sqlite" }
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
url = "2.5"

[profile.release]
lto = "thin"
strip = "symbols"
